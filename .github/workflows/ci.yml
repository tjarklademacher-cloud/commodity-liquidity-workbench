name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks (pyflakes rules and syntax errors)
        run: ruff check --select F,E9 core ui app.py tests
      - name: Architecture boundary (core must not import streamlit or plotly)
        run: python -m pytest -q tests/test_architecture_and_app.py -k "core_has_no_ui_imports or transitively"
      - name: Financial benchmarks and regression tests
        run: >-
          python -m pytest -q tests/test_treasury_engine.py tests/test_credit_basis_units.py
          tests/test_default_book.py tests/test_borrowing_base.py tests/test_stress_engine.py
          tests/test_haircuts.py tests/test_advanced_model.py
      - name: Full suite with coverage (unit, integration and Streamlit AppTest)
        run: python -m pytest -q --cov=core --cov=ui --cov-report=term --cov-report=xml
      - name: Application smoke test (headless server health check)
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8599 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8599/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          echo "Streamlit did not become healthy"; exit 1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
